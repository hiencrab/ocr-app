<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #5b6af8;
      --accent-h: #7381ff;
      --text: #e8eaf6;
      --text-muted: #7b82a8;
      --green: #4caf80;
      --red: #f06570;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    h1 span { color: var(--accent); }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 760px;
    }

    /* drop zone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(91,106,248,.07);
    }
    .dropzone input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .dropzone-icon { font-size: 2.4rem; margin-bottom: 10px; }
    .dropzone p { color: var(--text-muted); font-size: 0.9rem; }
    .dropzone p strong { color: var(--text); }
    .dropzone .file-types {
      margin-top: 8px; font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* options */
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }
    @media (max-width: 540px) { .options { grid-template-columns: 1fr; } }

    .opt-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .opt-group select, .opt-group input[type=number] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color .2s;
    }
    .opt-group select:focus, .opt-group input[type=number]:focus {
      border-color: var(--accent);
    }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
    }
    .toggle {
      position: relative; width: 40px; height: 22px; flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 22px;
      cursor: pointer;
      transition: background .2s;
    }
    .slider::before {
      content: ""; position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #fff; border-radius: 50%;
      transition: transform .2s;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
    .toggle-label { font-size: 0.88rem; color: var(--text-muted); }

    /* button */
    .btn-ocr {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn-ocr:hover:not(:disabled) { background: var(--accent-h); }
    .btn-ocr:active:not(:disabled) { transform: scale(.98); }
    .btn-ocr:disabled { opacity: .5; cursor: not-allowed; }

    /* selected file chip */
    .file-chip {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 16px;
      font-size: 0.88rem;
    }
    .file-chip.show { display: flex; }
    .file-chip .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-chip .fsize { color: var(--text-muted); flex-shrink: 0; }
    .file-chip .remove {
      flex-shrink: 0; background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 1rem;
      line-height: 1; padding: 2px 4px; border-radius: 4px;
    }
    .file-chip .remove:hover { color: var(--red); }

    /* result */
    .result-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 760px;
      margin-top: 24px;
    }
    .result-card.show { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .result-title { font-weight: 600; font-size: 1rem; }
    .result-meta { font-size: 0.8rem; color: var(--text-muted); }

    .result-actions { display: flex; gap: 8px; }
    .btn-sm {
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .btn-sm:hover { border-color: var(--accent); background: rgba(91,106,248,.1); }

    .result-text {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.88rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 460px;
      overflow-y: auto;
      color: var(--text);
    }
    .result-text::-webkit-scrollbar { width: 6px; }
    .result-text::-webkit-scrollbar-track { background: transparent; }
    .result-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* progress */
    .progress-wrap {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding: 14px 18px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .progress-wrap.show { display: flex; }
    .spinner {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-green { background: rgba(76,175,128,.15); color: var(--green); }
    .badge-red   { background: rgba(240,101,112,.15); color: var(--red); }
  </style>
</head>
<body>

  <h1>OCR <span>Tool</span></h1>
  <p class="subtitle">Trích xuất văn bản từ ảnh và PDF bằng PaddleOCR</p>

  <!-- Upload card -->
  <div class="card">
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.bmp,.tiff,.tif,.webp,.pdf" />
      <div class="dropzone-icon">📄</div>
      <p><strong>Kéo thả file vào đây</strong> hoặc click để chọn</p>
      <p class="file-types">JPG · PNG · BMP · TIFF · WEBP · PDF</p>
    </div>

    <div class="file-chip" id="fileChip">
      <span>📎</span>
      <span class="fname" id="chipName"></span>
      <span class="fsize" id="chipSize"></span>
      <button class="remove" id="removeFile" title="Xoá">✕</button>
    </div>

    <div class="options">
      <div class="opt-group">
        <label>Ngôn ngữ</label>
        <select id="langSelect">
          <option value="auto">🔍 Tự động nhận diện</option>
          <option value="vi">🇻🇳 Tiếng Việt</option>
          <option value="en">🇺🇸 English</option>
          <option value="ch">🇨🇳 Chinese</option>
          <option value="japan">🇯🇵 Japanese</option>
          <option value="korean">🇰🇷 Korean</option>
          <option value="fr">🇫🇷 French</option>
          <option value="german">🇩🇪 German</option>
        </select>
      </div>
      <div class="opt-group">
        <label>DPI (PDF)</label>
        <input type="number" id="dpiInput" value="200" min="72" max="600" step="50" />
      </div>
      <div class="opt-group" style="display:flex; flex-direction:column; justify-content:flex-end;">
        <div class="toggle-wrap">
          <label class="toggle">
            <input type="checkbox" id="gpuToggle" />
            <span class="slider"></span>
          </label>
          <span class="toggle-label">Dùng GPU</span>
        </div>
      </div>
    </div>

    <button class="btn-ocr" id="ocrBtn" disabled>
      <span>⚡</span> Bắt đầu OCR
    </button>

    <!-- progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="spinner"></div>
      <span id="progressMsg">Đang xử lý...</span>
    </div>
  </div>

  <!-- Result card -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div>
        <div class="result-title">Kết quả OCR</div>
        <div class="result-meta" id="resultMeta"></div>
      </div>
      <div class="result-actions">
        <button class="btn-sm" id="copyBtn">📋 Sao chép</button>
        <button class="btn-sm" id="downloadBtn">💾 Tải về</button>
      </div>
    </div>
    <div class="result-text" id="resultText"></div>
  </div>

  <script>
    const dropzone   = document.getElementById('dropzone');
    const fileInput  = document.getElementById('fileInput');
    const fileChip   = document.getElementById('fileChip');
    const chipName   = document.getElementById('chipName');
    const chipSize   = document.getElementById('chipSize');
    const removeFile = document.getElementById('removeFile');
    const ocrBtn     = document.getElementById('ocrBtn');
    const langSelect = document.getElementById('langSelect');
    const dpiInput   = document.getElementById('dpiInput');
    const gpuToggle  = document.getElementById('gpuToggle');
    const progressWrap = document.getElementById('progressWrap');
    const progressMsg  = document.getElementById('progressMsg');
    const resultCard   = document.getElementById('resultCard');
    const resultText   = document.getElementById('resultText');
    const resultMeta   = document.getElementById('resultMeta');
    const copyBtn      = document.getElementById('copyBtn');
    const downloadBtn  = document.getElementById('downloadBtn');

    let selectedFile = null;
    let currentFilename = '';

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    function setFile(file) {
      selectedFile = file;
      currentFilename = file.name;
      chipName.textContent = file.name;
      chipSize.textContent = formatSize(file.size);
      fileChip.classList.add('show');
      ocrBtn.disabled = false;
      resultCard.classList.remove('show');
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = '';
      fileChip.classList.remove('show');
      ocrBtn.disabled = true;
    }

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    removeFile.addEventListener('click', clearFile);

    dropzone.addEventListener('dragover', e => {
      e.preventDefault();
      dropzone.classList.add('drag-over');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) { fileInput.files = e.dataTransfer.files; setFile(file); }
    });

    ocrBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      ocrBtn.disabled = true;
      progressWrap.classList.add('show');
      progressMsg.textContent = 'Đang tải file lên...';
      resultCard.classList.remove('show');

      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('lang', langSelect.value);
      formData.append('gpu', gpuToggle.checked);
      formData.append('dpi', dpiInput.value);

      let jobId;
      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload thất bại');
        jobId = data.job_id;
      } catch (err) {
        progressWrap.classList.remove('show');
        ocrBtn.disabled = false;
        alert('Lỗi: ' + err.message);
        return;
      }

      progressMsg.textContent = 'Đang OCR, vui lòng chờ...';
      await pollJob(jobId);
    });

    const STATUS_MSG = {
      queued:       'Đang xếp hàng...',
      loading_model:'Đang tải model AI lần đầu (30-60s)...',
      processing:   'Đang nhận dạng văn bản...',
    };
    const AUTO_STATUS_MSG = {
      queued:       'Đang xếp hàng...',
      loading_model:'Đang phân tích ngôn ngữ...',
      processing:   'Đang nhận dạng văn bản...',
    };

    async function pollJob(jobId) {
      while (true) {
        await new Promise(r => setTimeout(r, 1500));
        try {
          const res  = await fetch('/status/' + jobId);
          const data = await res.json();

          if (data.status === 'done') {
            progressWrap.classList.remove('show');
            ocrBtn.disabled = false;
            showResult(data);
            return;
          }
          if (data.status === 'error') {
            progressWrap.classList.remove('show');
            ocrBtn.disabled = false;
            alert('Lỗi OCR: ' + (data.error || 'Không xác định'));
            console.error(data.trace);
            return;
          }
          const isAuto = langSelect.value === 'auto';
          const msgMap = isAuto ? AUTO_STATUS_MSG : STATUS_MSG;
          progressMsg.textContent = msgMap[data.status] || 'Đang xử lý...';
        } catch {
          progressMsg.textContent = 'Đang chờ server...';
        }
      }
    }

    function showResult(data) {
      const text = data.text || '(Không tìm thấy văn bản)';
      resultText.textContent = text;
      let langInfo = '';
      if (data.detected_lang_name) {
        langInfo = ` · 🔍 ${data.detected_lang_name}`;
      }
      resultMeta.innerHTML =
        `<span class="badge badge-green">✓ Hoàn tất</span> &nbsp;` +
        `${data.page_count} trang · ${data.char_count.toLocaleString()} ký tự${langInfo}`;
      resultCard.classList.add('show');
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultText.textContent).then(() => {
        copyBtn.textContent = '✅ Đã sao chép';
        setTimeout(() => copyBtn.textContent = '📋 Sao chép', 2000);
      });
    });

    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([resultText.textContent], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = currentFilename.replace(/\.[^.]+$/, '') + '_ocr.txt';
      a.click();
    });
  </script>
</body>
</html>
